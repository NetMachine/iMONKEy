<!DOCTYPE html>
<html lang="es">
<head>
<script>document.documentElement.className+=" js";</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iMONKEy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="apple-touch-icon" sizes="72x72" href="apple-touch-icon-180x180.png" />
<link rel="icon" href="favicon.png" type="image/x-icon">
<style>
  :root { touch-action: pan-x pan-y; height: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0; overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    background-color: #202020; color: #fff;
    -webkit-touch-callout: none;
    -webkit-user-select: none; -ms-user-select: none; user-select: none;
  }
  /* Capa negra de entrada (igual que la página principal) */
  #loading-overlay { display: none !important; }
  .js #loading-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: black;
    display: -webkit-box; display: -webkit-flex; display: flex; -webkit-justify-content: center; justify-content: center; -webkit-align-items: center; align-items: center;
    z-index: 9999; opacity: 1; transition: opacity 0.3s ease-in-out;
  }
  .js #loading-overlay.fade-out { opacity: 0; }
  .loading-text-container {
    position: fixed; bottom: 0; left: 0; width: 100%;
    color: #666; padding: 20px 0; display: flex; justify-content: center; opacity: 0;
  }
  .loading-text { margin: 0; font-size: 13px; font-weight: 300; }

  main {
    height: 100%; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    -webkit-justify-content: center; justify-content: center; -webkit-align-items: center; align-items: center; padding: 0 20px; box-sizing: border-box;
  }
  #contenedor {
    width: 90%; max-width: 400px;
    z-index: 99999;
  }
  .js #contenedor { opacity: 0; -webkit-transition: opacity 0.6s ease-in-out; transition: opacity 0.6s ease-in-out; }
  .js #contenedor.fade-in { opacity: 1; }
  #animation-container { width: 100%; display: -webkit-box; display: -webkit-flex; display: flex; }

  #descarga {
    margin-top: 8px;
    display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center;

    -webkit-transition: opacity 0.6s ease-in-out 0.35s, -webkit-transform 0.6s ease 0.35s;
    transition: opacity 0.6s ease-in-out 0.35s, transform 0.6s cubic-bezier(0.770, 0.000, 0.175, 1.000) 0.35s;
  }
  .js #descarga { opacity: 0; -webkit-transform: translateY(12px); transform: translateY(12px); }
  .js #descarga.fade-in { opacity: 1; -webkit-transform: none; transform: none; }

  .btn {
    display: -webkit-inline-box; display: -webkit-inline-flex; display: inline-flex; -webkit-align-items: center; align-items: center;
    padding: 14px 34px; border-radius: 40px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff; text-decoration: none;
    font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    transition: background 0.3s ease, border-color 0.3s ease, transform 0.15s ease;
  }
  .btn:hover, .btn:focus { background: rgba(255,255,255,0.18); border-color: #fff; outline: none; }
  .btn:active { -webkit-transform: scale(0.96); transform: scale(0.96); }
  .btn svg { margin-right: 10px; width: 20px; height: 20px; fill: #fff; }
  .btn.cargando { pointer-events: none; opacity: 0.6; }

  /* Mismo brillo que el título de la página principal */
  .shimmer {
    background: repeating-linear-gradient(to right, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.6) 25%, #fff 50%, rgba(255,255,255,0.6) 75%, rgba(255,255,255,0.45) 100%);
    background-clip: text; -webkit-background-clip: text;
    background-size: 200% auto;
    -webkit-text-fill-color: transparent;
    -webkit-animation: brillo 5s infinite linear; animation: brillo 5s infinite linear;
  }
  @-webkit-keyframes brillo { to { background-position: -200% center; } }
  @keyframes brillo { to { background-position: -200% center; } }

  #logo-fijo { display: none; width: 100%; }
  .sin-lottie #logo-fijo { display: block; -webkit-animation: parpadeo 2.4s infinite; animation: parpadeo 2.4s infinite; }
  @-webkit-keyframes parpadeo { 0%,70%,100% { opacity: 1; } 80% { opacity: 0.15; } 90% { opacity: 1; } }
  @keyframes parpadeo { 0%,70%,100% { opacity: 1; } 80% { opacity: 0.15; } 90% { opacity: 1; } }
  #version { margin-top: 14px; font-size: 12px; font-weight: 300; color: #888; min-height: 15px; }
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-text-container"><p class="loading-text">Toca en cualquier lugar</p></div>
</div>

<main>
  <div id="contenedor"><div id="animation-container"></div><img id="logo-fijo" src="site/iMONKEy-Logo.svg" alt="iMONKEy"></div>
  <div id="descarga">
    <a id="btn-descargar" class="btn cargando" href="https://github.com/NetMachine/mk-cfg" draggable="false">
      <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18v11.17l-4.59-4.58L6 10l7 7 7-7-1.41-1.41L13 13.17V2h-1z"/></svg>
      <span class="shimmer">Descargar iMonkeyTV</span>
    </a>
    <p id="version">Buscando la &uacute;ltima versi&oacute;n&hellip;</p>
  </div>
</main>

<script src="site/lottie.min.js"></script>
<script>
/* ES5 puro: compatible con navegadores de Android 6 (sin =>, fetch, finally) */
var velocidad = 6;
function azar(min, max) { return Math.random() * (max - min) + min; }
function sinLottie() { document.getElementById('contenedor').className += ' sin-lottie'; }
try {
  if (typeof lottie === 'undefined') throw new Error('sin lottie');
  var animation = lottie.loadAnimation({
    container: document.getElementById('animation-container'),
    renderer: 'svg', loop: false, autoplay: false,
    path: 'site/iMONKEy.json'
  });
  animation.addEventListener('complete', function () {
    velocidad = azar(6.5, 7);
    animation.setSpeed(velocidad);
    setTimeout(function () { animation.goToAndPlay(0, true); }, Math.floor(azar(50, 6000)));
  });
  animation.addEventListener('data_failed', sinLottie);
  setTimeout(function () { try { animation.setSpeed(velocidad); animation.play(); } catch (e) { sinLottie(); } }, 1200);
} catch (e) { sinLottie(); }

/* Última versión desde version.json */
var btn = document.getElementById('btn-descargar');
var ver = document.getElementById('version');
function listo() { btn.className = btn.className.replace(/\s*cargando/g, ''); }
try {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://raw.githubusercontent.com/NetMachine/mk-cfg/main/version.json?t=' + new Date().getTime(), true);
  xhr.timeout = 10000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    var v = null;
    try { if (xhr.status === 200) v = JSON.parse(xhr.responseText); } catch (e) {}
    if (v && v.apkUrl) {
      btn.href = v.apkUrl;
      btn.setAttribute('download', 'iMonkeyTV-' + (v.versionName || '') + '.apk');
      ver.innerHTML = 'Versi&oacute;n ' + (v.versionName || '');
    } else { ver.innerHTML = ''; }
    listo();
  };
  xhr.ontimeout = function () { ver.innerHTML = ''; listo(); };
  xhr.send();
} catch (e) { ver.innerHTML = ''; listo(); }

/* Desvanecimiento de la capa negra */
var overlay = document.getElementById('loading-overlay');
var contenedor = document.getElementById('contenedor');
var descarga = document.getElementById('descarga');
var quitado = false;
function mostrar() {
  if (contenedor.className.indexOf('fade-in') < 0) contenedor.className += ' fade-in';
  if (descarga.className.indexOf('fade-in') < 0) descarga.className += ' fade-in';
}
function quitarCapa() {
  if (quitado || !overlay) return;
  quitado = true;
  overlay.className += ' fade-out';
  setTimeout(function () {
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    contenedor.style.zIndex = 'auto';
  }, 400);
}
function entrar() { mostrar(); setTimeout(quitarCapa, 300); }
window.addEventListener('load', function () { setTimeout(entrar, 300); });
setTimeout(entrar, 2500);
document.addEventListener('click', function () { mostrar(); quitarCapa(); });
document.addEventListener('keydown', function () { mostrar(); quitarCapa(); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>
</body>
</html>
