<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iMONKEy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="72x72" href="apple-touch-icon-180x180.png" />
<link rel="icon" href="favicon.png" type="image/x-icon">
<style>
  :root { touch-action: pan-x pan-y; height: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0; overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    background-color: #202020; color: #fff;
    -webkit-touch-callout: none;
    -webkit-user-select: none; -ms-user-select: none; user-select: none;
  }
  /* Capa negra de entrada (igual que la página principal) */
  #loading-overlay {
    position: fixed; inset: 0; background: black;
    display: flex; justify-content: center; align-items: center;
    z-index: 9999; opacity: 1; transition: opacity 0.3s ease-in-out;
  }
  #loading-overlay.fade-out { opacity: 0; }
  .loading-text-container {
    position: fixed; bottom: 0; left: 0; width: 100%;
    color: #666; padding: 20px 0; display: flex; justify-content: center; opacity: 0;
  }
  .loading-text { margin: 0; font-size: 13px; font-weight: 300; }

  main {
    height: 100%; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 0 20px; box-sizing: border-box;
  }
  #contenedor {
    width: 90%; max-width: 400px;
    opacity: 0; transition: opacity 0.6s ease-in-out;
    z-index: 99999;
  }
  #contenedor.fade-in { opacity: 1; }
  #animation-container { width: 100%; display: flex; }

  #descarga {
    margin-top: 8px;
    display: flex; flex-direction: column; align-items: center;
    opacity: 0; transform: translateY(12px);
    transition: opacity 0.6s ease-in-out 0.35s, transform 0.6s cubic-bezier(0.770, 0.000, 0.175, 1.000) 0.35s;
  }
  #descarga.fade-in { opacity: 1; transform: none; }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 34px; border-radius: 40px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff; text-decoration: none;
    font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    transition: background 0.3s ease, border-color 0.3s ease, transform 0.15s ease;
  }
  .btn:hover, .btn:focus { background: rgba(255,255,255,0.18); border-color: #fff; outline: none; }
  .btn:active { transform: scale(0.96); }
  .btn svg { width: 20px; height: 20px; fill: #fff; }
  .btn.cargando { pointer-events: none; opacity: 0.6; }

  /* Mismo brillo que el título de la página principal */
  .shimmer {
    background: repeating-linear-gradient(to right, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.6) 25%, #fff 50%, rgba(255,255,255,0.6) 75%, rgba(255,255,255,0.45) 100%);
    background-clip: text; -webkit-background-clip: text;
    background-size: 200% auto;
    -webkit-text-fill-color: transparent;
    animation: brillo 5s infinite linear;
  }
  @keyframes brillo { to { background-position: -200% center; } }

  #version { margin-top: 14px; font-size: 12px; font-weight: 300; color: #888; min-height: 15px; }
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-text-container"><p class="loading-text">Toca en cualquier lugar</p></div>
</div>

<main>
  <div id="contenedor"><div id="animation-container"></div></div>
  <div id="descarga">
    <a id="btn-descargar" class="btn cargando" href="https://github.com/NetMachine/mk-cfg" draggable="false">
      <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18v11.17l-4.59-4.58L6 10l7 7 7-7-1.41-1.41L13 13.17V2h-1z"/></svg>
      <span class="shimmer">Descargar iMonkeyTV</span>
    </a>
    <p id="version">Buscando la última versión…</p>
  </div>
</main>

<script src="https://unpkg.com/lottie-web@5.7.8/build/player/lottie.min.js"></script>
<script>
/* Animación del logo (la misma de la página principal: se repite con pausas al azar = parpadeo) */
const animation = lottie.loadAnimation({
  container: document.getElementById('animation-container'),
  renderer: 'svg', loop: false, autoplay: false,
  path: 'site/iMONKEy.json'
});
let velocidad = 6;
const azar = (min, max) => Math.random() * (max - min) + min;
animation.addEventListener('complete', () => {
  velocidad = azar(6.5, 7);
  animation.setSpeed(velocidad);
  setTimeout(() => animation.goToAndPlay(0, true), Math.floor(azar(50, 6000)));
});
setTimeout(() => { animation.setSpeed(velocidad); animation.play(); }, 1200);

/* Última versión: se lee version.json, así el botón siempre baja la más nueva */
const btn = document.getElementById('btn-descargar');
const ver = document.getElementById('version');
fetch('https://raw.githubusercontent.com/NetMachine/mk-cfg/main/version.json?t=' + Date.now(), { cache: 'no-store' })
  .then(r => r.json())
  .then(v => {
    if (v && v.apkUrl) {
      btn.href = v.apkUrl;
      btn.setAttribute('download', 'iMonkeyTV-' + (v.versionName || '') + '.apk');
      ver.textContent = 'Versión ' + (v.versionName || '');
    } else { ver.textContent = ''; }
  })
  .catch(() => { ver.textContent = ''; })
  .finally(() => btn.classList.remove('cargando'));

/* Desvanecimiento de la capa negra (igual que la principal) */
const overlay = document.getElementById('loading-overlay');
const contenedor = document.getElementById('contenedor');
const descarga = document.getElementById('descarga');
let quitado = false;
function quitarCapa() {
  if (quitado || !overlay) return;
  quitado = true;
  overlay.classList.add('fade-out');
  setTimeout(() => { overlay.remove(); contenedor.style.zIndex = 'auto'; }, 400);
}
window.addEventListener('load', () => {
  setTimeout(() => {
    contenedor.classList.add('fade-in');
    descarga.classList.add('fade-in');
    setTimeout(quitarCapa, 300);
  }, 300);
});
document.addEventListener('click', () => {
  contenedor.classList.add('fade-in');
  descarga.classList.add('fade-in');
  quitarCapa();
});
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
